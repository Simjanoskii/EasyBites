<div class="auth-card">
            <a class="brand auth-brand" href="#home"><span class="brand-mark">e</span><span>easy<span class="brand-accent">bites</span></span></a>
            <span class="section-kicker">A SEAT AT OUR TABLE</span><h1 id="auth-title">Welcome back.</h1><p class="auth-intro">Sign in to get a little closer to your local favourites.</p>
            <div class="auth-tabs"><button class="selected" type="button" data-auth-mode="login">Sign in</button><button type="button" data-auth-mode="register">Create account</button></div>
            <form id="auth-form">
              <div class="register-name-field hidden"><label for="auth-name">Your name</label><input id="auth-name" type="text" autocomplete="name" placeholder="First and last name"></div>
              <label for="auth-email">Email address</label><input id="auth-email" type="email" autocomplete="email" placeholder="you@example.com" required>
              <label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8">
              <button class="primary-button auth-submit" type="submit">Sign in <span>→</span></button>
            </form>
            <p class="auth-demo-note">Demo screen only. No account will be created or signed in.</p>
            <button class="auth-back" type="button" data-page-link="home">← Back to discovering</button>
          </div>
