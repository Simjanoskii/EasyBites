<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f3">
    <meta name="description" content="Discover Sarajevo's local restaurants and order your favourites with EasyBites.">
    <meta name="easybites-api-base-url" content="http://127.0.0.1:8000/api/v1">
    <title>EasyBites — Sarajevo, served.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/services/weather-service.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="EasyBites home">
          <span class="brand-mark" aria-hidden="true">e</span>
          <span>easy<span class="brand-accent">bites</span></span>
        </a>
        <button class="mobile-menu-button" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="main-nav">
          <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
          <a class="nav-link active" href="#home" data-page="home">Discover</a>
          <a class="nav-link" href="#orders" data-page="orders">My orders</a>
          <a class="nav-link" href="#profile" data-page="profile">Profile</a>
        </nav>
        <div class="topbar-actions">
          <button class="location-button" type="button" aria-label="Delivery location">
            <span class="location-pin" aria-hidden="true">⌖</span>
            <span><small>Delivering to</small><strong>Sarajevo, BiH</strong></span>
            <span class="chevron" aria-hidden="true">⌄</span>
          </button>
          <a class="cart-button" href="#cart" aria-label="Open basket">
            <span aria-hidden="true">♧</span><span class="cart-label">Basket</span><span class="cart-count" id="cart-count">0</span>
          </a>
          <a class="avatar-button" href="#profile" aria-label="Your profile">M</a>
        </div>
      </header>

      <main id="spapp">
        <section class="page active" id="page-home" aria-labelledby="hero-title" data-load="home.html" aria-busy="false"></section>

        <section class="page content-page" id="page-restaurant" aria-labelledby="restaurant-detail-title" data-load="restaurant.html" aria-busy="false"></section>

        <section class="page content-page" id="page-cart" aria-labelledby="cart-title" data-load="cart.html" aria-busy="false"></section>

        <section class="page content-page" id="page-orders" aria-labelledby="orders-title" data-load="orders.html" aria-busy="false"></section>

        <section class="page content-page" id="page-profile" aria-labelledby="profile-title" data-load="profile.html" aria-busy="false"></section>

        <section class="page content-page admin-page" id="page-admin" aria-labelledby="admin-title" data-load="admin.html" aria-busy="false"></section>

        <section class="page content-page" id="page-auth" aria-labelledby="auth-title" data-load="auth.html" aria-busy="false"></section>

        <section class="page content-page" id="page-error_404" aria-label="Page not found" data-load="404.html" aria-busy="false"></section>
      </main>

      <footer class="footer"><a class="brand footer-brand" href="#home"><span class="brand-mark">e</span><span>easy<span class="brand-accent">bites</span></span></a><span>Made with a little extra love in Sarajevo <span class="footer-heart">♥</span></span><span>Student project · Demo preview</span></footer>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
